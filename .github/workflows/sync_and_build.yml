name: Sync Upstream and Build

on:
  schedule:
    # Run daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag version you want to build"
        required: false
        default: "spend_logs_patch"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-database

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changes: ${{ steps.check-tag.outputs.changes }}
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/BerriAI/litellm.git || true

      - name: Get latest upstream stable tag
        id: get-tag
        run: |
          LINE=$(git ls-remote --tags upstream | grep -E 'refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' | sort -t '/' -k 3 -V | tail -n 1)
          UPSTREAM_TAG=$(echo "$LINE" | awk -F'/' '{print $3}')
          echo "Latest upstream stable tag is: $UPSTREAM_TAG"
          echo "tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT

      - name: Check if tag already exists in origin
        id: check-tag
        run: |
          UPSTREAM_TAG="${{ steps.get-tag.outputs.tag }}"
          
          # Fetch all tags from origin
          git fetch origin --tags
          
          if git rev-parse "$UPSTREAM_TAG" >/dev/null 2>&1; then
            echo "Tag $UPSTREAM_TAG already exists in our repository. No sync needed."
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "Tag $UPSTREAM_TAG is new! Sync needed."
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Fetch and Merge tag
        if: steps.check-tag.outputs.changes == 'true'
        run: |
          UPSTREAM_TAG="${{ steps.get-tag.outputs.tag }}"
          
          # Fetch the specific tag from upstream
          git fetch upstream tag "$UPSTREAM_TAG" --no-tags
          
          # Merge the tag commit into main
          git merge "$UPSTREAM_TAG" --no-edit
          if [ $? -ne 0 ]; then
            echo "Merge conflict detected. Aborting."
            git merge --abort
            exit 1
          fi
          
          # Force-recreate the tag to point to our merge commit (incorporating our changes)
          git tag -f "$UPSTREAM_TAG"

      - name: Push changes and tag
        if: steps.check-tag.outputs.changes == 'true'
        run: |
          UPSTREAM_TAG="${{ steps.get-tag.outputs.tag }}"
          git push origin main
          git push origin "$UPSTREAM_TAG"

  build-and-push-database:
    needs: sync
    if: needs.sync.outputs.changes == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Determine Docker tag
        id: docker-tag
        run: |
          if [ "${{ needs.sync.outputs.changes }}" = "true" ]; then
            echo "tag=${{ needs.sync.outputs.tag }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ needs.sync.outputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Database Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.database
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.docker-tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
